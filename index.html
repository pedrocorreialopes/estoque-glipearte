<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Estoque Glipearte</title>
  <meta name="description" content="Sistema de controle de acervo para a Glipearte Pegue e Monte - Aluguel de artigos para festas." />
  <meta name="author" content="Pedro Correia Lopes Filho" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-rose-600 focus:text-white focus:px-4 focus:py-2 rounded">Pular para conteúdo principal</a>

  <div id="app" class="min-h-screen flex flex-col">
    <header class="bg-rose-700 text-white shadow-lg z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button id="menu-toggle" class="lg:hidden p-2 rounded-md hover:bg-rose-600 focus:outline-none focus:ring-2 focus:ring-white" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="fas fa-bars"></i>
          </button>
          <div class="flex items-center gap-2">
            <i class="fas fa-gift text-2xl text-rose-200"></i>
            <div>
              <h1 class="text-lg font-bold leading-tight">Glipearte</h1>
              <p class="text-xs text-rose-200">Pegue e Monte</p>
            </div>
          </div>
        </div>

        <div class="hidden md:flex items-center flex-1 max-w-md mx-6">
          <label for="global-search" class="sr-only">Buscar produto ou fornecedor</label>
          <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-rose-200"><i class="fas fa-search"></i></span>
            <input id="global-search" type="search" placeholder="Buscar produto ou fornecedor..." class="w-full bg-rose-800 text-white placeholder-rose-300 rounded-full pl-10 pr-4 py-2 border border-rose-600 focus:outline-none focus:ring-2 focus:ring-white focus:bg-rose-900 transition" />
          </div>
        </div>

        <div class="flex items-center gap-3">
          <span class="hidden sm:inline text-sm text-rose-100">Usuário: <strong>Admin</strong></span>
          <button id="btn-help" class="p-2 rounded-full hover:bg-rose-600 focus:outline-none focus:ring-2 focus:ring-white" aria-label="Ajuda">
            <i class="fas fa-circle-question"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 bg-slate-900 text-slate-300 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto transition-transform duration-200 ease-in-out flex flex-col" aria-label="Menu principal">
        <div class="h-16 lg:hidden flex items-center justify-between px-4 bg-rose-700 text-white">
          <span class="font-bold">Menu</span>
          <button id="menu-close" class="p-2 rounded-md hover:bg-rose-600" aria-label="Fechar menu">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
          <ul class="space-y-1 px-3">
            <li><button data-route="dashboard" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-rose-500 transition" aria-current="page"><i class="fas fa-chart-line w-5"></i> Dashboard</button></li>
            <li><button data-route="products" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-rose-500 transition"><i class="fas fa-boxes w-5"></i> Estoque</button></li>
            <li><button data-route="suppliers" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-rose-500 transition"><i class="fas fa-truck-field w-5"></i> Fornecedores</button></li>
            <li><button data-route="financial" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-rose-500 transition"><i class="fas fa-dollar-sign w-5"></i> Financeiro</button></li>
            <li><button data-route="reports" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-rose-500 transition"><i class="fas fa-file-invoice w-5"></i> Relatórios</button></li>
            <li><button data-route="users" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-rose-500 transition"><i class="fas fa-users w-5"></i> Usuários</button></li>
          </ul>
        </nav>
        <div class="p-4 border-t border-slate-800">
          <p class="text-xs text-slate-500">© 2026 Glipearte</p>
          <p class="text-xs text-slate-600">Desenvolvido por Pedro C. Lopes Filho</p>
        </div>
      </aside>

      <div id="overlay" class="fixed inset-0 z-20 bg-black/50 hidden lg:hidden" aria-hidden="true"></div>

      <main id="main-content" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div id="page-content" class="max-w-7xl mx-auto"></div>
      </main>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2" aria-live="polite" aria-atomic="true"></div>

  <div id="confirm-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 p-6">
      <h3 id="confirm-title" class="text-lg font-semibold text-slate-900">Confirmar ação</h3>
      <p id="confirm-message" class="mt-2 text-slate-600">Tem certeza?</p>
      <div class="mt-6 flex justify-end gap-3">
        <button id="confirm-cancel" class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-rose-500">Cancelar</button>
        <button id="confirm-ok" class="px-4 py-2 rounded-lg bg-rose-600 text-white hover:bg-rose-700 focus:outline-none focus:ring-2 focus:ring-rose-500">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
